<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Python Start · Урок 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap">
<style>
/* Layout: одна «глиняная» карточка-слайд на живом градиентном фоне + тёмная панель управления снизу.
   Единый яркий детский мир (без тёмной темы по решению дизайна); тёмные «лаборатории» — отдельное настроение слайда. */
:root{
  color-scheme: light;
  --ink:#1c1940; --ink-2:#4d4a72; --ink-3:#8a87a8;
  --card:#ffffff; --card-2:#f5f2ff; --line:#e7e2fb;
  --violet:#7b5cff; --violet-d:#5a3be0; --pink:#ff6fb0; --peach:#ffb48c; --sky:#5fc3ff; --mint:#3fd7a6; --sun:#ffcf4a; --orange:#ff8a3d;
  --ok:#10b47f; --ok-bg:#e6fbf3; --bad:#ef3d6b; --bad-bg:#ffedf2;
  --code-bg:#0f0d26; --code-fg:#ecebff; --code-line:#1f1c44;
  --bar:#232546; --bar-2:#33365e;
  --f-display:"Rubik","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  --clay:0 1px 0 rgba(255,255,255,.95) inset,0 -5px 12px rgba(91,66,190,.07) inset,0 16px 34px -14px rgba(64,40,150,.30),0 3px 8px rgba(64,40,150,.06);
  --clay-sm:0 1px 0 rgba(255,255,255,.9) inset,0 -3px 8px rgba(91,66,190,.08) inset,0 8px 18px -10px rgba(64,40,150,.32);
  --r-xl:36px; --r-lg:26px; --r-md:18px; --r-sm:12px;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#efeaff;color:var(--ink);font-family:var(--f-body);font-weight:600;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
img{max-width:100%}

/* ---------- фон ---------- */
#bg{position:fixed;inset:0;z-index:0;transition:background 0.6s ease;background:var(--bgimg)}
#bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.55) 1.2px,transparent 1.3px);background-size:26px 26px;opacity:.45;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.blob.b1{width:42vw;height:42vw;left:-10vw;top:-12vw;background:var(--b1)}
.blob.b2{width:36vw;height:36vw;right:-8vw;bottom:-10vw;background:var(--b2);animation-delay:-6s}
.blob.b3{width:26vw;height:26vw;right:22vw;top:-8vw;background:var(--b3);animation-delay:-11s}
@keyframes drift{to{transform:translate(4vw,3vw) scale(1.08)}}
body[data-bg="0"]{--bgimg:linear-gradient(135deg,#efe4ff 0%,#ffe1ef 45%,#ffe9d9 100%);--b1:#b9a2ff;--b2:#ffb3cf;--b3:#ffd2b3}
body[data-bg="1"]{--bgimg:linear-gradient(135deg,#dff3ff 0%,#e6e4ff 50%,#ffe4f1 100%);--b1:#8fd4ff;--b2:#c3b3ff;--b3:#ffc2dc}
body[data-bg="2"]{--bgimg:linear-gradient(135deg,#d9fbef 0%,#dff1ff 55%,#efe6ff 100%);--b1:#8ff0cb;--b2:#9fd6ff;--b3:#d1c2ff}
body[data-bg="3"]{--bgimg:linear-gradient(135deg,#fff0dd 0%,#ffe3ea 50%,#efe3ff 100%);--b1:#ffcf9f;--b2:#ffb1c6;--b3:#cdb6ff}
body[data-bg="4"]{--bgimg:linear-gradient(135deg,#e9e3ff 0%,#dcf4ff 50%,#dbfbf0 100%);--b1:#b4a4ff;--b2:#8fe3ff;--b3:#93f2cf}
body[data-bg="lab"]{--bgimg:linear-gradient(135deg,#2b1060 0%,#4a1470 50%,#1d1650 100%);--b1:#8a3dff;--b2:#ff4fa8;--b3:#4a6bff}
body[data-bg="night"]{--bgimg:linear-gradient(135deg,#141a4a 0%,#2a1f6e 55%,#0f2b5c 100%);--b1:#5a4dff;--b2:#22c7ff;--b3:#ff5fb0}

/* ---------- сцена ---------- */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{flex:1;min-height:0;display:flex;justify-content:center}
.slide{position:relative;width:100%;max-width:1760px;height:100%;overflow-y:auto;overflow-x:hidden;background:rgba(255,255,255,.80);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:var(--r-xl);box-shadow:var(--clay);padding:20px clamp(18px,2.6vw,44px) 24px;scrollbar-width:thin}
.slide.anim{animation:slideIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:.0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.slide.dark{background:rgba(18,15,46,.86);color:#eeeaff;--ink:#f3f0ff;--ink-2:#c3bfe6;--ink-3:#8f8bb8;--card:#1c1940;--card-2:#26224f;--line:#35306a;--clay:0 1px 0 rgba(255,255,255,.08) inset,0 18px 40px -16px rgba(0,0,0,.55);--clay-sm:0 1px 0 rgba(255,255,255,.07) inset,0 10px 20px -12px rgba(0,0,0,.6)}

.sl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font:800 13px/1 var(--f-display);letter-spacing:.04em;background:var(--card-2);color:var(--ink-2)}
.chip.num{background:linear-gradient(135deg,#6f63ff,#a64dff);color:#fff;box-shadow:0 6px 14px -6px rgba(111,99,255,.8)}
.sl-head .sp{flex:1}
.chip.badge{background:#fff4d0;color:#8a5a00;border:1.5px solid #ffe08a}
.dark .chip.badge{background:rgba(255,207,74,.12);color:#ffd76b;border-color:rgba(255,207,74,.35)}

h1.t{font:900 clamp(28px,3.5vw,50px)/1.08 var(--f-display);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance;color:var(--ink)}
p.lead{font-size:clamp(16px,1.45vw,21px);line-height:1.55;color:var(--ink-2);margin:0 0 22px;max-width:70ch;font-weight:700}
.body{display:flex;flex-direction:column;gap:20px}

/* ---------- общие элементы ---------- */
.island{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--clay);padding:20px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.ic3d{display:block;height:auto;aspect-ratio:1;filter:drop-shadow(0 10px 10px rgba(60,40,140,.22));user-select:none;-webkit-user-drag:none}
.float{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.icon-bub{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;background:var(--tint,#efeaff);box-shadow:var(--clay-sm);flex:none}
.icon-bub .ic3d{width:46px;height:46px}
.card-t{font:800 19px/1.2 var(--f-display);margin:12px 0 6px;color:var(--ink);overflow-wrap:anywhere}
.card-d{font-size:15.5px;line-height:1.5;color:var(--ink-2);margin:0}
.lift{transition:transform .25s ease,box-shadow .25s ease}
.lift:hover{transform:translateY(-6px)}
.t-violet{--tint:#ece6ff}.t-pink{--tint:#ffe3f0}.t-peach{--tint:#ffeadd}.t-sky{--tint:#dff3ff}.t-mint{--tint:#dcfaef}.t-sun{--tint:#fff4cf}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 26px;border-radius:20px;font:800 18px/1 var(--f-display);color:#fff;background:linear-gradient(135deg,#14c98e,#0fb3b0);box-shadow:0 6px 0 #08876f,0 16px 26px -10px rgba(16,180,127,.7);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #08876f,0 8px 14px -8px rgba(16,180,127,.7)}
.btn.orange{background:linear-gradient(135deg,#ffa31a,#ff6a2b);box-shadow:0 6px 0 #c4470f,0 16px 26px -10px rgba(255,106,43,.7)}
.btn.orange:active{box-shadow:0 2px 0 #c4470f}
.btn.violet{background:linear-gradient(135deg,#7b5cff,#b14dff);box-shadow:0 6px 0 #4e2fc4,0 16px 26px -10px rgba(123,92,255,.7)}
.btn.violet:active{box-shadow:0 2px 0 #4e2fc4}
.btn.ghost{background:var(--card-2);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.sm{padding:11px 16px;font-size:15px;border-radius:15px}
.btn.icon{padding:13px 15px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* ---------- редактор кода ---------- */
.code{background:var(--code-bg);color:var(--code-fg);border-radius:var(--r-lg);box-shadow:0 18px 36px -18px rgba(15,13,38,.8),0 1px 0 rgba(255,255,255,.06) inset;overflow:hidden;min-width:0}
.code-top{display:flex;align-items:center;gap:8px;padding:13px 18px;border-bottom:1px solid var(--code-line)}
.dots{display:flex;gap:7px}.dots i{width:12px;height:12px;border-radius:50%;background:#ff4f6d}.dots i:nth-child(2){background:#ffb020}.dots i:nth-child(3){background:#1ed39a}
.code-top .fn{margin-left:auto;font:600 13px var(--f-code);color:#a6a2d6}
.code-top .ttl{font:800 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:#b6b1ea;margin-left:8px}
.code pre{margin:0;padding:18px 20px;font:600 clamp(14px,1.25vw,18px)/1.7 var(--f-code);overflow-x:auto;white-space:pre}
.code pre .ln{display:block;border-radius:8px;padding:0 8px;margin:0 -8px;transition:background .2s}
.code pre .ln.on{background:rgba(255,207,74,.22);box-shadow:inset 3px 0 0 #ffcf4a}
.k-fn{color:#6fd3ff}.k-str{color:#9df07a}.k-num{color:#ffb35c}.k-kw{color:#c792ff}.k-com{color:#7a77a6;font-style:italic}.k-op{color:#ff8fc2}
.term{background:#070617;color:#4bf0a6;border-radius:var(--r-md);font:700 clamp(15px,1.3vw,19px)/1.6 var(--f-code);padding:16px 18px;min-height:64px;white-space:pre-wrap;word-break:break-word}
.term .p{color:#6c6995;margin-right:10px}
.term .err{color:#ff6b8f}
.term .hint{color:#ffd76b;font-family:var(--f-body);font-weight:700;font-size:.92em;display:block;margin-top:6px}
.term .muted{color:#6c6995}

/* ---------- панель управления ---------- */
#bar{position:relative;z-index:5;margin:8px auto 0;width:100%;max-width:1760px;display:flex;align-items:center;gap:6px;background:var(--bar);color:#dcdaf5;border-radius:24px;padding:9px 12px;box-shadow:0 18px 30px -14px rgba(20,18,60,.6)}
#bar .bb{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;font:800 14px var(--f-display);color:#dcdaf5}
#bar .bb:hover{background:var(--bar-2)}
#bar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bar .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:14px}
#bar .nav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--bar-2)}
#bar .nav.next{background:linear-gradient(135deg,#ff4fb2,#a64dff);color:#fff;box-shadow:0 6px 16px -6px rgba(255,79,178,.8)}
#bar .cnt{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:84px;font:800 17px var(--f-code);color:#fff}
#bar .cnt small{color:#8d8ab6;font-weight:600;margin:0 4px}
#bar .prog{width:84px;height:5px;border-radius:5px;background:#3b3e68;overflow:hidden}
#bar .prog i{display:block;height:100%;background:linear-gradient(90deg,#ff4fb2,#a64dff);transition:width .3s}

/* оверлеи */
.ov{position:fixed;inset:0;z-index:20;background:rgba(22,18,60,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.ov-card{background:#fff;color:#1c1940;border-radius:30px;box-shadow:var(--clay);width:100%;max-width:1100px;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.ov-head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid #eee9ff}
.ov-head h2{margin:0;font:900 22px var(--f-display);flex:1}
.ov-body{overflow:auto;padding:20px 22px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.thumb{text-align:left;background:#f6f3ff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 0 #fff inset,0 6px 14px -10px rgba(64,40,150,.4);transition:transform .15s}
.thumb:hover{transform:translateY(-3px);background:#efeaff}
.thumb.cur{box-shadow:inset 0 0 0 2.5px #7b5cff}
.thumb b{font:800 12px var(--f-code);color:#7b5cff}
.thumb span{font:800 14.5px/1.25 var(--f-display);color:#1c1940}
.thumb em{font-style:normal;font-size:12px;color:#8a87a8}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:30;background:#1c1940;color:#fff;padding:12px 18px;border-radius:14px;font:800 15px var(--f-display);box-shadow:0 12px 24px -10px rgba(0,0,0,.5)}

/* ---------- проверочные списки ---------- */
.ck{display:flex;flex-direction:column;gap:12px}
.ck-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;background:var(--card);border-radius:20px;box-shadow:var(--clay-sm);padding:14px 16px;border:2px solid transparent;transition:background .25s,border-color .25s}
.ck-code{font:700 clamp(15px,1.3vw,18px)/1.45 var(--f-code);color:var(--ink);background:var(--card-2);border-radius:12px;padding:8px 12px;justify-self:start;max-width:100%;overflow-x:auto;white-space:pre}
.ck-code.txt{font-family:var(--f-body);font-weight:800;white-space:normal}
.ck-pills{display:flex;gap:8px}
.pill{padding:10px 14px;border-radius:14px;font:800 15px var(--f-display);background:var(--card-2);color:var(--ink-2);box-shadow:0 3px 0 var(--line);transition:transform .1s}
.pill:active{transform:translateY(2px)}
.pill[aria-pressed="true"].yes{background:#14c98e;color:#fff;box-shadow:0 3px 0 #08876f}
.pill[aria-pressed="true"].no{background:#ff5c85;color:#fff;box-shadow:0 3px 0 #c42a52}
.ck-why{grid-column:1/-1;font-size:15.5px;line-height:1.5;color:var(--ink-2)}
.ck-why b{color:var(--ink)}
.ck-why .term{margin-top:8px;font-size:15px;min-height:0;padding:10px 14px}
.ck-row.good{background:var(--ok-bg);border-color:#7fe6c2}
.ck-row.badr{background:var(--bad-bg);border-color:#ffb0c4}
.dark .ck-row.good{background:rgba(16,180,127,.14);border-color:rgba(127,230,194,.5)}
.dark .ck-row.badr{background:rgba(239,61,107,.14);border-color:rgba(255,176,196,.45)}
.ck-mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:900 18px var(--f-display);color:#fff}
.ck-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px}
.score{font:900 18px var(--f-display);padding:10px 16px;border-radius:14px;background:#fff4d0;color:#8a5a00}
.dark .score{background:rgba(255,207,74,.14);color:#ffd76b}
.ck-msg{font-weight:800;color:var(--bad)}

/* ---------- холст черепашки ---------- */
.tc{position:relative;width:100%;max-width:100%;border-radius:22px;overflow:hidden;box-shadow:var(--clay-sm),0 0 0 1px #e9e4ff;background:#fbfaff}
.tc canvas{display:block}
.tc-badge{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.92);color:#3a375e;font:700 12px var(--f-code);padding:5px 9px;border-radius:9px;box-shadow:0 2px 6px rgba(0,0,0,.08)}

/* ---------- отдельные слайды ---------- */
.cover{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.cover h1.t{font-size:clamp(32px,4.6vw,64px);max-width:18ch}
.cover-art{position:relative;width:min(560px,100%);aspect-ratio:16/9}
.cover-art .ped{position:absolute;left:50%;bottom:2%;width:46%;height:20%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#fff 0%,#ece6ff 60%,#d6ccff 100%);box-shadow:0 18px 30px -12px rgba(80,50,180,.45)}
.cover-art .hero{position:absolute;left:50%;bottom:12%;width:38%;transform:translateX(-50%)}
.cover-art .fl{position:absolute;width:13%}
.loader{position:relative;width:min(520px,100%);height:54px;border-radius:999px;background:#fff;box-shadow:var(--clay);overflow:hidden;border:3px solid #ffe39a}
.loader i{position:absolute;inset:4px auto 4px 4px;border-radius:999px;background:linear-gradient(90deg,#ffd23f,#ffb01f);box-shadow:0 2px 0 rgba(255,255,255,.7) inset;width:calc(var(--p,0%) - 8px);min-width:40px;transition:width .2s}
.loader span{position:relative;z-index:1;display:grid;place-items:center;height:100%;font:800 16px var(--f-display);color:#6a4300}

.sec{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:30px;align-items:center;min-height:min(62vh,560px)}
.sec h1.t{font-size:clamp(36px,5.2vw,74px)}
.sec .art{position:relative;display:grid;place-items:center;min-height:280px}
.sec .art .big{width:min(300px,70%)}
.sec .art .sm{position:absolute;width:min(120px,26%)}
.sec .art .sm .ic3d,.cover-art .fl .ic3d,.cover-art .hero .ic3d{width:100%}
.eyebrow{font:800 clamp(22px,2.6vw,34px) var(--f-code);color:#2f6bff;margin-bottom:6px}
.fact{display:flex;gap:14px;align-items:center;margin-top:18px;background:#fff8dc;border-radius:20px;padding:14px 18px;box-shadow:var(--clay-sm);color:#6a4a00;font-size:16px;line-height:1.45}
.fact .ic3d{width:44px;height:44px;flex:none}

.qcard{display:flex;gap:16px;align-items:center;text-align:left;width:100%;position:relative}
.qcard .card-t{margin:0;font-size:clamp(17px,1.6vw,22px)}
.qcard .coin{position:absolute;top:12px;right:12px;width:40px;opacity:0;transform:scale(.4) rotate(-30deg);transition:all .35s cubic-bezier(.3,1.6,.5,1)}
.qcard.done{background:#fffbe9}
.qcard.done .coin{opacity:1;transform:none}
.counter{display:inline-flex;align-items:center;gap:8px;font:900 18px var(--f-display);background:#fff4d0;color:#8a5a00;padding:8px 14px;border-radius:14px}
.counter .ic3d{width:28px;height:28px}

.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;position:relative}
.map::before{content:"";position:absolute;left:12%;right:12%;top:62px;border-top:4px dashed #c8bcff;z-index:0}
.mission{position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.mission .n{font:900 14px var(--f-display);color:#fff;background:var(--violet);border-radius:999px;padding:6px 12px}
.mission .ic3d{width:90px;height:90px}
.mission .card-t{margin:0}

.why{grid-template-columns:repeat(6,minmax(0,1fr))}
.why>*:nth-child(-n+3){grid-column:span 2}
.why>*:nth-child(n+4){grid-column:span 3}

.langs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.lang{text-align:left;border-radius:22px;padding:16px 18px;background:var(--card);box-shadow:var(--clay-sm);transition:transform .2s,background .2s,box-shadow .2s}
.lang .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lang .nm{font:900 20px var(--f-display)}
.lang .cnt{font:800 12.5px var(--f-display);padding:5px 10px;border-radius:999px;background:#2d3150;color:#fff;white-space:nowrap}
.lang p{margin:6px 0 0;font-size:14px;color:var(--ink-3);line-height:1.4}
.lang[aria-selected="true"]{transform:translateY(-6px) scale(1.02)}
.lang.cpp[aria-selected="true"]{background:#1f2747;color:#fff}.lang.cpp[aria-selected="true"] p{color:#aab0d6}
.lang.java[aria-selected="true"]{background:#9a5631;color:#fff}.lang.java .cnt{background:#7a2e00}.lang.java[aria-selected="true"] p{color:#ffd8bf}
.lang.py .cnt{background:#0fae7f}
.lang.py[aria-selected="true"]{background:linear-gradient(135deg,#12c08b,#0ea98d);color:#fff;box-shadow:0 0 0 4px #b7f5dd,var(--clay-sm)}.lang.py[aria-selected="true"] p{color:#e1fff3}.lang.py[aria-selected="true"] .cnt{background:rgba(255,255,255,.25)}
.praise{margin:0 20px 18px;border-radius:14px;padding:12px 16px;background:rgba(30,211,154,.12);border:1px solid rgba(30,211,154,.35);color:#9ff5cf;font-family:var(--f-body);font-weight:700;font-size:15px}
.praise.warn{background:rgba(255,176,32,.1);border-color:rgba(255,176,32,.35);color:#ffd99a}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:20px;background:var(--card);box-shadow:var(--clay-sm);font:800 15px var(--f-display);border:2.5px solid transparent;transition:transform .2s,border-color .2s}
.tile .ic3d{width:44px;height:44px}
.tile[aria-selected="true"]{border-color:#7b5cff;transform:translateY(-4px)}
.infobar{display:flex;gap:18px;align-items:center;border-radius:28px;padding:20px 24px;color:#fff;background:linear-gradient(110deg,#3a2a96 0%,#26206a 55%,#121433 100%);box-shadow:0 18px 34px -18px rgba(30,20,90,.8)}
.infobar .ib-ic{width:76px;height:76px;border-radius:22px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.infobar .ib-ic .ic3d{width:52px;height:52px}
.infobar h3{margin:0;font:900 24px var(--f-display);color:#ffd23f;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.infobar .tag{font:800 12px var(--f-display);color:#d9d2ff;background:rgba(123,92,255,.35);border:1px solid rgba(160,140,255,.5);padding:5px 10px;border-radius:999px}
.infobar p{margin:6px 0 0;color:#d8d4f5;font-size:16px;line-height:1.45}

.flip{perspective:1000px;min-height:280px;text-align:left}
.flip .in{position:relative;height:100%;min-height:280px;transition:transform .6s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-lg);box-shadow:var(--clay);padding:22px;display:flex;flex-direction:column}
.flip .f{background:var(--card);align-items:center;justify-content:center;text-align:center;gap:6px}
.flip .f .ic3d{width:110px;height:110px}
.flip .b{background:linear-gradient(150deg,#7b5cff,#b04dff);color:#fff;transform:rotateY(180deg);justify-content:center;gap:10px}
.flip .b .card-t{color:#fff;margin:0}.flip .b p{margin:0;line-height:1.5;font-size:16px}
.flip .hintx{font-size:13px;color:var(--ink-3);font-weight:800}

.mail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:start}
.inbox{display:flex;flex-direction:column;gap:8px;min-height:120px}
.letter{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:9px 12px;box-shadow:var(--clay-sm);font-size:15px;transition:transform .45s ease,opacity .45s ease}
.letter .ic3d{width:26px;height:26px}
.letter.fly{transform:translateX(60px) scale(.8);opacity:0}
.folders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.folder{border-radius:22px;padding:14px;background:var(--card);box-shadow:var(--clay);min-height:220px}
.folder h4{margin:0 0 8px;display:flex;align-items:center;gap:8px;font:900 17px var(--f-display)}
.folder h4 .ic3d{width:32px;height:32px}
.folder .n{margin-left:auto;font:900 16px var(--f-code);background:var(--card-2);padding:3px 9px;border-radius:9px}
.folder ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.folder li{font-size:13.5px;line-height:1.35;background:var(--card-2);border-radius:10px;padding:6px 9px;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}

.bigq{display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px;padding:10px 0 20px}
.bigq h1.t{font-size:clamp(30px,4.2vw,58px);max-width:20ch}
.bigq .arts{display:flex;gap:30px;justify-content:center}
.bigq .arts .ic3d{width:90px}
.yn{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.yn .btn{font-size:clamp(24px,2.6vw,34px);padding:22px 56px;border-radius:26px}
.yn .btn.no{background:linear-gradient(135deg,#ff6f9b,#ff4f6d);box-shadow:0 7px 0 #c32a4c,0 18px 28px -10px rgba(255,79,109,.7)}
.reply{max-width:760px;border-radius:24px;padding:18px 22px;font-size:18px;line-height:1.5;text-align:left;display:flex;gap:16px;align-items:center;box-shadow:var(--clay)}
.reply .ic3d{width:64px;flex:none}
.reply.ok{background:var(--ok-bg)}.reply.no{background:#fff4e3}

.timeline{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding-top:10px}
.timeline::before{content:"";position:absolute;left:4%;right:4%;top:58px;height:6px;border-radius:6px;background:linear-gradient(90deg,#ffcf4a,#ff8a3d)}
.medal{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;font:800 14px/1.2 var(--f-display);text-align:center}
.medal .disc{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#7fd4ff,#2d8ee0);box-shadow:0 0 0 5px #fff,var(--clay);transition:transform .25s}
.medal .disc .ic3d{width:56px;height:56px}
.medal .yr{font:800 12px var(--f-code);background:#ff8a3d;color:#fff;border-radius:8px;padding:3px 7px}
.medal[aria-selected="true"] .disc{transform:scale(1.14);box-shadow:0 0 0 5px #ffcf4a,var(--clay)}

.tbl{display:flex;flex-direction:column;gap:10px}
.tr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:center;background:var(--card);border-radius:16px;padding:12px 16px;box-shadow:var(--clay-sm);font-size:16px}
.tr.h{background:transparent;box-shadow:none;font:800 13px var(--f-display);color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;padding-block:0}
.tr.gold{background:linear-gradient(90deg,#fff1b8,#ffd56b);font-weight:900}
.arrow-up{color:var(--ok);font-weight:900}.arrow-dn{color:var(--bad);font-weight:900}

.kw{display:flex;flex-wrap:wrap;gap:12px}
.kwc{min-width:120px;padding:14px 18px;border-radius:18px;font:800 20px var(--f-code);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18),0 12px 20px -10px rgba(0,0,0,.35);transition:transform .2s;text-align:center}
.kwc small{display:block;font:800 13px var(--f-body);opacity:.95;margin-top:4px;min-height:18px}
.kwc:hover{transform:translateY(-3px)}
.kwc[data-open="1"]{transform:translateY(-3px) rotate(-1.5deg)}

.formula{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center}
.fcard{border-radius:28px;padding:22px 16px;text-align:center;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.18),0 20px 30px -14px rgba(0,0,0,.35)}
.fcard .ic3d{width:96px;height:96px;margin:0 auto 10px}
.fcard b{display:block;font:900 20px/1.15 var(--f-display)}
.fcard span{display:block;margin-top:6px;font-size:14.5px;opacity:.92}
.fop{font:900 56px var(--f-display);color:var(--orange);text-shadow:0 4px 0 #ffd9bd}
.fcard.jump{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{40%{transform:translateY(-18px) scale(1.04)}}

.def{font:900 clamp(28px,3.4vw,46px)/1.15 var(--f-display);margin:0;color:var(--ink)}
.def em{font-style:normal;background:linear-gradient(transparent 60%,#ffe27a 60%)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.steps{display:flex;flex-direction:column;gap:10px}
.stepbtn{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:var(--clay-sm);font-size:17px;font-weight:800}
.stepbtn .ic3d{width:34px;height:34px}
.stepbtn[disabled]{opacity:.35;cursor:default}
.slot{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;border:2.5px dashed #cfc5ff;min-height:56px;font-size:17px;font-weight:800;color:var(--ink-3)}
.slot.f{border-style:solid;border-color:#b7a6ff;background:#f4f0ff;color:var(--ink)}
.slot .no{font:900 14px var(--f-display);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#7b5cff;color:#fff;flex:none}
.slot .ic3d{width:30px;height:30px}
.slots.ok .slot{border-color:#7fe6c2;background:var(--ok-bg)}
.slots.bad .slot{border-color:#ffb0c4;background:var(--bad-bg)}

.prop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border-radius:22px;overflow:hidden;box-shadow:var(--clay-sm);background:var(--card)}
.prop>div{padding:16px 20px;display:flex;align-items:center;gap:14px;font-size:17px;line-height:1.45}
.prop>div:first-child{font-weight:800;color:var(--ink)}
.prop>div:last-child{background:var(--card-2);color:var(--ink-2)}
.prop .ic3d{width:42px;height:42px;flex:none}
.prop-h{display:grid;grid-template-columns:1fr 1fr;padding:0 20px;font:800 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.reveal>*{animation:rise .5s both}
.reveal>*:nth-child(2){animation-delay:.08s}.reveal>*:nth-child(3){animation-delay:.16s}.reveal>*:nth-child(4){animation-delay:.24s}
@keyframes rise{from{transform:translateY(12px);opacity:.0}}

.note{position:relative;background:#fffdf5;border-radius:18px;box-shadow:var(--clay-sm);min-height:340px;background-image:linear-gradient(#e8eefc 1px,transparent 1px),linear-gradient(90deg,#e8eefc 1px,transparent 1px);background-size:22px 22px;border-left:6px solid #4d6bff;overflow:hidden}
.note span{position:absolute;font-size:clamp(14px,1.3vw,18px);font-weight:800;color:#2b2950;white-space:nowrap}

.diag{background:var(--card);border-radius:28px;box-shadow:var(--clay);padding:18px 20px}
.diag-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.diag-h b{font:900 18px var(--f-display);flex:1}
.diag-h .ic3d{width:30px;height:30px}
.drow{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border-radius:20px;padding:14px 16px;border:2px solid #ffd0dc;background:#fff7f9;margin-top:10px;transition:background .25s,border-color .25s}
.drow .cmd{font:800 16px var(--f-code);background:#fff;border-radius:12px;padding:8px 12px;box-shadow:0 2px 6px rgba(0,0,0,.06);white-space:nowrap}
.drow .q{font:900 16px var(--f-display);color:var(--bad)}
.drow .fix{display:block;font-size:14.5px;color:#0b8a63;font-weight:800;margin-top:4px}
.drow .st{margin-left:auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#ffe0e8;color:var(--bad);font:900 18px var(--f-display);flex:none}
.drow.done{background:var(--ok-bg);border-color:#93ebc9}
.drow.done .st{background:#14c98e;color:#fff}
.drow code{font-family:var(--f-code);background:#d9f7ea;padding:1px 6px;border-radius:6px}

.bin{font:800 clamp(16px,1.6vw,22px) var(--f-code);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bin .b{color:#7b5cff;letter-spacing:.08em}

.rule{border-radius:24px;padding:16px;background:var(--card);box-shadow:var(--clay);border:3px solid var(--rc);display:flex;flex-direction:column;gap:12px}
.rule .rh{display:flex;gap:12px;align-items:center}
.rule .rh .ic3d{width:44px;height:44px}
.rule .rh b{font:900 19px/1.2 var(--f-display)}
.rule p{margin:0;font-size:15px;color:var(--ink-2);line-height:1.45}
.seg{display:inline-flex;background:var(--card-2);border-radius:14px;padding:4px;gap:4px;align-self:flex-start}
.seg button{padding:8px 12px;border-radius:11px;font:800 14px var(--f-display);color:var(--ink-2)}
.seg button[aria-pressed="true"].e{background:#ff5c85;color:#fff}
.seg button[aria-pressed="true"].g{background:#14c98e;color:#fff}
.rule .code pre{font-size:15px;padding:12px 14px}
.rule .term{font-size:14.5px;min-height:0;padding:10px 14px}

.anat{display:flex;flex-direction:column;gap:18px;align-items:center}
.anat .code{width:min(860px,100%)}
.anat pre.huge{font-size:clamp(34px,6vw,84px);line-height:1.25;text-align:center;padding:26px 20px}
.part{border-radius:14px;padding:0 4px;cursor:pointer;transition:background .2s,box-shadow .2s}
.part.on{background:rgba(255,255,255,.14);box-shadow:0 0 0 3px var(--pc)}
.bubbles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%}
.bub{border-radius:20px;padding:14px 16px;background:var(--card);box-shadow:var(--clay-sm);border:3px solid transparent;text-align:left;font-size:15.5px;line-height:1.4;transition:transform .2s,border-color .2s}
.bub b{display:block;font:900 17px var(--f-code);margin-bottom:4px;color:var(--pc)}
.bub.on{border-color:var(--pc);transform:translateY(-5px)}

.lab .lab-tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--code-line)}
.lab .lab-tabs button{padding:9px 15px;border-radius:999px;background:#1d1a44;border:1px solid #34306a;color:#d6d2ff;font:800 14.5px var(--f-display)}
.lab .lab-tabs button[aria-selected="true"]{background:#7b5cff;border-color:#9b85ff;color:#fff}
.lab-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;padding:18px}
.lab-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.lab-col h4{margin:0;display:flex;justify-content:space-between;gap:10px;font:800 15px var(--f-display);color:#a9b8ff}
.lab-col h4 small{font:700 13px var(--f-body);color:#8b87b8}
.lab-col h4.o{color:#4bf0a6}
.editor{width:100%;min-height:clamp(240px,34vh,380px);resize:vertical;border:1px solid #2b2760;border-radius:18px;background:#050418;color:#c9f8d9;font:600 clamp(16px,1.45vw,21px)/1.65 var(--f-code);padding:16px 18px;tab-size:4;outline:none}
.editor:focus{border-color:#7b5cff}
.lab .term{min-height:clamp(240px,34vh,380px);border:1px solid #2b2760;border-radius:18px;font-size:clamp(16px,1.45vw,21px)}
.lab-foot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;padding:0 18px 18px;align-items:center}
.lab-tip{display:flex;gap:10px;align-items:center;background:#171440;border-radius:14px;padding:12px 14px;color:#bdb8e8;font-size:14.5px;line-height:1.4}
.lab-tip .ic3d{width:28px;height:28px;flex:none}

.word{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.wbtn{display:flex;flex-direction:column;align-items:center;gap:10px}
.wbtn .w{font:800 clamp(28px,4vw,52px) var(--f-code);color:#fff;padding:14px 22px;border-radius:20px;box-shadow:0 6px 0 rgba(0,0,0,.2),0 16px 24px -12px rgba(0,0,0,.4);transition:transform .2s}
.wbtn[aria-expanded="true"] .w{transform:translateY(-6px)}
.wbtn .m{max-width:220px;font-size:15px;line-height:1.4;text-align:center;background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:var(--clay-sm)}

.padwrap{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.1fr) minmax(0,.85fr);gap:22px;align-items:start}
.padwrap [data-log] .code pre{max-height:min(52vh,460px);overflow-y:auto}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:". f ." "l c r" ". col .";gap:10px;align-items:center}
.pad .center{grid-area:c;display:grid;place-items:center}
.pad .center .ic3d{width:min(150px,100%)}
.pbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 8px;border-radius:18px;background:var(--card);box-shadow:0 5px 0 #d9d0ff,var(--clay-sm);transition:transform .08s,box-shadow .08s;text-align:center}
.pbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #d9d0ff}
.pbtn code{font:800 clamp(14px,1.3vw,17px) var(--f-code);color:var(--violet-d)}
.pbtn span{font-size:12.5px;color:var(--ink-2);font-weight:700}
.colors{grid-area:col;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;box-shadow:0 3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.4);border:3px solid #fff}
.sw[aria-pressed="true"]{outline:3px solid var(--violet);outline-offset:2px}
.bonusbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:12px 16px;border-radius:18px;background:linear-gradient(90deg,#2b1a6e,#4a2590);color:#ffe27a;font:800 15px var(--f-display);box-shadow:0 0 0 3px #ffcf4a}
.bonusbar code{font-family:var(--f-code);color:#fff}

.task{border-radius:24px;padding:20px;background:#fffaf0;box-shadow:var(--clay);border:2px solid #ffe2a8}
.task b{font:900 18px var(--f-display);color:#9a5a00}
.task p{font-size:18px;line-height:1.5;margin:6px 0 0}
.qa{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.qa button{text-align:left;border-radius:16px;padding:12px 14px;background:var(--card);box-shadow:var(--clay-sm);font-size:16px;font-weight:800}
.qa button .ans{display:block;margin-top:8px;font:700 15px var(--f-code);color:#0b8a63;background:var(--ok-bg);border-radius:10px;padding:8px 10px;white-space:pre-wrap}

.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick{border-radius:20px;background:#fff;box-shadow:var(--clay-sm);padding:10px;border:3px solid transparent;display:flex;flex-direction:column;gap:6px;align-items:center;font:800 15px var(--f-display)}
.pick img{border-radius:12px;aspect-ratio:1/0.85;object-fit:cover;width:100%}
.pick[aria-pressed="true"]{border-color:var(--violet)}

.unl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.unl h3{font:900 21px var(--f-display);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.unl .ic3d{width:30px;height:30px}
.lv{display:flex;gap:12px;align-items:center;border-radius:18px;padding:14px 16px;font:800 17px/1.3 var(--f-display);margin-bottom:10px}
.lv.on{background:rgba(30,211,154,.16);border:2px solid #3ef0a8;color:#c6ffe6;box-shadow:0 0 22px -6px rgba(62,240,168,.6)}
.lv.off{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.18);color:#b7b3dc}
.lv small{display:block;font:700 13.5px var(--f-body);opacity:.8;margin-top:2px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

/* код прямо в заголовке: print() на сером фоне */
h1.t code{font-family:var(--f-code);font-weight:800;font-size:.86em;background:#e9e6f5;color:var(--ink);border-radius:.25em;padding:.02em .22em}

/* вопрос «какое место?» */
.places{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.places .btn{font-size:clamp(22px,2.3vw,30px);padding:18px 30px;border-radius:24px}
.places .btn.pick-bad{background:linear-gradient(135deg,#ff6f9b,#ff4f6d);box-shadow:0 7px 0 #c32a4c}

/* рейтинг: Python №1 */
.top1{display:flex;align-items:center;gap:20px;border-radius:28px;padding:22px 26px;background:linear-gradient(90deg,#fff1b8,#ffd56b);box-shadow:var(--clay)}
.top1 .place{font:900 clamp(56px,6vw,90px)/1 var(--f-display);color:#8a5a00}
.top1 b{display:block;font:900 clamp(26px,2.6vw,38px) var(--f-display)}
.top1 span{font-size:17px;color:#6a4a00;font-weight:800}
.others{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px;font-size:16px;color:var(--ink-2)}
.others .chip{font-size:15px;padding:9px 14px}

/* словарик ключевых слов */

.rflip .ex.bad span{color:var(--bad)} .rflip .ex.good span{color:var(--ok)}

/* слайды «Выполни задание на платформе» */

/* перерыв с таймером */
.brk{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;min-height:min(66vh,620px)}

.brk .clock{font:900 clamp(80px,13vw,190px)/1 var(--f-code);color:var(--violet-d);letter-spacing:.02em;padding:14px 40px;border-radius:40px;background:#fff;box-shadow:var(--clay);font-variant-numeric:tabular-nums}
.brk .ring{width:min(560px,90%);height:14px;border-radius:14px;background:#ece6ff;overflow:hidden}
.brk .ring i{display:block;height:100%;background:linear-gradient(90deg,#14c98e,#7b5cff);transition:width 1s linear}
.brk.over .clock{color:var(--ok)}
.brk .done{font:900 clamp(26px,3vw,40px) var(--f-display);color:var(--ok)}
/* слайд 33: проверка слева, редактор справа (окна редактора друг под другом) */
.t1 .ck{gap:8px}.t1 .ck-row{padding:9px 12px}

<script>
const META = [{"id":"cover","tag":"Старт","badge":"Миссия №1","title":"Python Start: Твой первый шаг в программирование","text":"Добро пожаловать в штаб юных программистов! Сегодня ты получишь свой первый пропуск в мир кода.","prompt":"Титульный экран-заставка в стиле мобильной игры. Фон — тёплый персиково-кремовый с мягким градиентом в розовый и сиреневый, едва заметная точечная сетка. В центре на глянцевом белом пьедестале стоит большой пластилиновый логотип-змейка Python (синий и жёлтый). Вокруг парят 3D-иконки: робот, шестерёнка, пазл, ракета, лампочка, монетка, ноутбук — каждая слегка покачивается. Сверху огромный контрастный заголовок, внизу объёмная «глиняная» полоса загрузки с надписью «Добро пожаловать. Загрузка интерфейса…», которая заполняется и превращается в кнопку «Начать миссию».","code":"","inter":"Анимированная полоса загрузки → кнопка «Начать миссию» переводит на следующий слайд.","lead":true,"mood":"day"},{"id":"lesson","tag":"Урок 1","badge":"Вводный урок","title":"Урок 1. Введение в язык Python","text":"Сегодня — твоя первая миссия. Ты узнаешь, что такое Python, и напишешь свои первые программы.","prompt":"Слева — крупный заголовок на белом глиняном острове, над ним моноширинная надпись «Урок 1.» ярко-синим цветом, как строка кода. Справа — 3D-персонаж: ребёнок за ноутбуком с кодом на экране, за спиной мягкая сиреневая подложка-круг. Фон — переход из голубого в мятный. Под заголовком три пилюли-чипа: «Миссия №1», «Уровень: Новичок», «Питомец: Черепашка».","code":"","inter":"","lead":true,"mood":"day"},{"id":"meet","tag":"Знакомство","badge":"Раздел","title":"Знакомство","text":"Прежде чем писать код, давай познакомимся друг с другом!","prompt":"Раздел-заставка. Розово-персиковый градиент, по центру большой белый остров с заголовком «Знакомство». Рядом 3D-иконки рукопожатия и машущей ладошки, мягкие тени, лёгкое покачивание.","code":"","inter":"","lead":true,"mood":"day"},{"id":"hello","tag":"Знакомство","badge":"Разговор","title":"Давай познакомимся!","text":"Ответь на вопросы — за каждый ответ получаешь монетку знакомства.","prompt":"Четыре объёмные карточки-вопроса в сетке 2×2 на белых островах с пастельной подложкой (голубая, мятная, персиковая, сиреневая). На каждой — 3D-иконка (ладошка, школа, геймпад, задумчивый смайлик) и вопрос крупным шрифтом. При нажатии карточка «вдавливается» и на ней появляется золотая монетка с галочкой. В правом верхнем углу — счётчик монеток.","code":"","inter":"Нажатие на карточку отмечает вопрос отвеченным и начисляет монетку (счётчик 0/4).","lead":true,"mood":"day"},{"id":"today","tag":"План","badge":"3 миссии","title":"Сегодня на занятии","text":"Сегодня тебя ждут три миссии.","prompt":"Горизонтальная «карта уровней» из трёх глиняных карточек, соединённых пунктирной дорожкой. Каждая — с номером миссии в цветном кружке и 3D-иконкой: глобус (почему Python популярен), черепашка (знакомство с черепашкой), ноутбук (первые программы). Фон — сиренево-голубой градиент.","code":"","inter":"","lead":true,"mood":"day"},{"id":"intro","tag":"Python","badge":"Раздел","title":"Знакомство с Python","text":"Встречай главного героя урока — язык Python! Кстати, назван он не в честь змеи, а в честь британского комедийного шоу «Летающий цирк Монти Пайтона».","prompt":"Раздел-заставка. Глубокий сине-фиолетовый градиент с мягкими жёлтыми бликами (цвета логотипа Python). Слева — большая 3D-змейка, справа — заголовок на белом острове и плашка с забавным фактом.","code":"","inter":"","lead":true,"mood":"day"},{"id":"why","tag":"Python","badge":"5 суперсил","title":"Почему выбирают Python","text":"Python завоевал мир благодаря своей универсальности и простоте. Это идеальный язык для начинающих и мощный инструмент для профессионалов.","prompt":"Пять глиняных карточек-«суперсил»: три в верхнем ряду, две пошире — в нижнем. На каждой 3D-иконка в цветном круге (книги, значок «бесплатно», глобус, кубики-кирпичики, коробка с модулями), жирный заголовок и короткое пояснение. Фон — голубой с тонкими светлыми «микросхемными» линиями.","code":"","inter":"Наведение приподнимает карточку.","lead":true,"mood":"day"},{"id":"battle","tag":"Битва языков","badge":"1 строка против 5","title":"Почему выбирают Python: Битва синтаксисов","text":"Посмотри, как выглядит вывод знаменитой фразы «Hello, World!» на разных языках. Нажми на язык — увидишь его программу!","prompt":"Арена сравнения. Три карточки-пьедестала: 1 — C++ (тёмно-синяя, «сложный замок из кода»), 2 — Java (терракотовая, «массивный механизм из классов и скобок»), 3 — Python (изумрудная, сияющая, со значком ракеты). На каждой — плашка с количеством строк. Под ними — тёмный детский редактор кода с тремя цветными точками и именем файла; при выборе языка код в нём меняется. У Python снизу зелёная плашка-похвала.","code":"// C++ (main.cpp)\n#include \u003ciostream\u003e\nusing namespace std;\nint main() {\n  cout \u003c\u003c \"Hello, World!\";\n}\n\n// Java (MyClass.java)\nclass MyClass {\n  public static void main(String[] args) {\n    System.out.println(\"Hello, World!\");\n  }\n}\n\n# Python (hello.py)\nprint(\"Hello, World!\")","inter":"Нажатие на карточку языка показывает его программу в редакторе.","lead":true,"mood":"day"},{"id":"edu","tag":"Python в мире","badge":"Образование","title":"Python в образовании","text":"Python учат по всему миру — и, возможно, скоро он пригодится тебе на экзамене!","prompt":"Четыре карточки-«достижения» в ряд, как значки в игре: глобус, шапочка выпускника, город, листок с ручкой. Каждая на белом острове с цветной верхней подсветкой. Фон — нежно-голубые объёмные абстрактные формы, похожие на пластилиновые волны.","code":"","inter":"","lead":true,"mood":"day"},{"id":"industry","tag":"Python в мире","badge":"Нажми на иконку","title":"Python в индустрии: Кто использует Питон?","text":"На Python работают технологические лидеры планеты. Нажми на иконку — узнаешь, что именно Python делает в этой компании!","prompt":"Сетка 4×4 из белых квадратных плиток с 3D-иконками (ракета — NASA, лупа — Google, кнопка «плей» — YouTube, яблоко — Apple, мозг — IBM, атом — CERN, плёнка — DreamWorks, хлопушка — Pixar, телефон — Nokia, такси — Яндекс, фотоаппарат — Instagram, человечки — Facebook, тележка — eBay, конверт — Mail.ru, молния — Intel, принтер — HP). Выбранная плитка подсвечивается фиолетовой рамкой и приподнимается. Под сеткой — тёмно-фиолетовая информационная панель с большой иконкой, жёлтым названием компании, бейджем «Работает на Python» и описанием.","code":"","inter":"Нажатие на иконку компании показывает, где в ней используется Python.","lead":true,"mood":"day"},{"id":"spheres","tag":"Python в мире","badge":"3 сферы","title":"3 важные сферы применения Python","text":"Python умеет многое, но три сферы особенно важны. Нажми на карточку — она перевернётся и покажет пример!","prompt":"Три крупные карточки-«острова» с 3D-иллюстрациями: веб-страница с инструментами (веб-разработка), светящийся атом с базой данных (Data Science), робот-манипулятор с шестерёнками (автоматизация). Карточки переворачиваются как игральные карты, на обороте — пример из жизни. Фон — мятно-голубой.","code":"","inter":"Карточки переворачиваются по нажатию.","lead":true,"mood":"day"},{"id":"auto","tag":"Python в мире","badge":"Автоматизация","title":"Python и автоматизация процессов","text":"Например, Mail.ru использует Python в системе обработки электронной почты. Робот-программа сам сортирует тысячи писем, пока люди занимаются делом.","prompt":"Слева — глиняный «почтовый ящик» с летящими 3D-конвертами, справа — три папки-корзинки: «Входящие», «Спам», «Рассылки». По кнопке «Запустить робота-сортировщика» конверты по очереди улетают в нужные папки, а счётчики растут. Фон — голубой с оранжевыми акцентами.","code":"","inter":"Кнопка запускает анимацию сортировки писем.","lead":true,"mood":"day"},{"id":"web","tag":"Python в мире","badge":"Веб-разработка","title":"Python и веб-разработка","text":"Python — это не просто язык, а фундамент для создания больших веб-приложений, которые выдерживают миллионы пользователей.","prompt":"Сверху — пластилиновая иллюстрация ночного неба с логотипом-змейкой. Ниже три карточки-фреймворка: коробка «всё включено» (Django), стеклянная колба (Flask — по-английски «колба»), кирпичики-модули (Pyramid). Внизу — длинная плашка-вывод с иконкой лампочки.","code":"","inter":"","lead":true,"mood":"day"},{"id":"graphics","tag":"Python в мире","badge":"Графика","title":"Python и компьютерная графика","text":"Python помогает художникам и аниматорам: на нём пишут плагины и скрипты для графических программ.","prompt":"Четыре карточки-«мастерские» 2×2: кисть (GIMP — растровая графика), кубик (Blender — 3D-графика), карандаш (Inkscape — векторная графика), киноплёнка (Cinema 4D — 3D-графика и анимация). У каждой — цветная пилюля с типом графики. Фон — нежно-розовый с персиковым.","code":"","inter":"","lead":true,"mood":"day"},{"id":"gameq","tag":"Python и игры","badge":"Вопрос","title":"Как ты считаешь, можно ли с помощью Python создавать игры?","text":"","prompt":"Большой вопрос в центре на белом острове, вокруг парят 3D-геймпад, джойстик и кубик. Под вопросом две огромные глиняные кнопки: зелёная «Да» и розовая «Нет». После ответа появляется плашка с реакцией и стрелка «Смотри следующий слайд». Фон — фиолетово-розовый игровой градиент.","code":"","inter":"Кнопки «Да» / «Нет» показывают реакцию на ответ.","lead":false,"mood":"day"},{"id":"games","tag":"Python и игры","badge":"Таймлайн","title":"Python и игры","text":"Да! Python используют и в настоящих играх. Нажми на игру — узнаешь, чем ей помог Python. А свою первую игру ты сможешь написать с библиотекой Pygame.","prompt":"Игровой таймлайн: горизонтальная дорожка с годами 2003 → 2014, на ней шесть круглых глиняных «медалей» с 3D-иконками (ракета — EVE Online, танк — Battlefield 2, замок — Civilization IV, гитара — Frets on Fire, меч — Mount \u0026 Blade, домик — The Sims 4). Выбранная медаль увеличивается, под дорожкой — карточка с описанием. Фон — тёмно-синий с неоновыми фиолетовыми бликами.","code":"","inter":"Нажатие на игру показывает, как в ней используется Python.","lead":true,"mood":"day"},{"id":"tiobeq","tag":"Python в мире","badge":"Вопрос","title":"Как ты считаешь, какое место занимает Python в рейтинге популярности языков программирования?","text":"","prompt":"","code":"","inter":"","lead":false,"mood":"day"},{"id":"tiobe","tag":"Python в мире","badge":"Рейтинг","title":"Python — самый популярный язык программирования в мире!","text":"По рейтингу TIOBE с осени 2021 года Python занимает 1-е место!","prompt":"Слева — турнирная таблица в виде глиняных строк-плашек: место в феврале 2021, место в феврале 2020, стрелка изменения (зелёная вверх / красная вниз), язык. Строка Python подсвечена золотым градиентом и иконкой кубка. Справа — 3D-кубок и медаль. Фон — жёлто-персиковый.","code":"","inter":"","lead":true,"mood":"day"},{"id":"concepts","tag":"Основы","badge":"Словарик","title":"Базовые понятия программиста","text":"Каждый разработчик должен владеть базовыми понятиями. Нажми на слово, чтобы узнать его перевод и назначение!","prompt":"Изометрическая 3D-сцена: дети с ноутбуками сидят на ступеньках, вокруг парят цветные плашки-ключевые слова Python (if, elif, else, while, for, def, return, is, in, import, print). Плашки — как глиняные таблички. Нажатая табличка переворачивается и показывает перевод. Счётчик собранных ключей. Фон — голубой.","code":"","inter":"Нажатие на слово открывает его перевод, счётчик собранных ключей.","lead":true,"mood":"day"},{"id":"birth","tag":"Основы","badge":"Формула","title":"Рождение программы","text":"Программа рождается из двух частей: идеи (алгоритма) и языка, на котором её записали.","prompt":"Формула из трёх больших глиняных плиток: оранжевая «Идея / Алгоритм» (3D-блок-схема), синяя «Язык программирования» (книга со змейкой), фиолетовая «Программа» (монитор с кодом), между ними объёмные знаки «+» и «=». По кнопке «Собрать программу» плитки по очереди подпрыгивают и «съезжаются». Фон — оранжево-розовый с тонкими линиями микросхем.","code":"","inter":"Кнопка запускает анимацию сборки формулы.","lead":true,"mood":"day"},{"id":"algo","tag":"Основы","badge":"Определение","title":"Алгоритм","text":"Алгоритм — это последовательность действий для достижения цели. Попробуй сам: расставь шаги утреннего алгоритма по порядку!","prompt":"Слева — определение крупным шрифтом на белом острове, справа — мини-игра: четыре перемешанные глиняные карточки шагов «Утро школьника» с 3D-иконками. Ребёнок нажимает их по порядку, они встают в нумерованную колонку. Фон — голубые пластилиновые волны и тонкая линия-путь со стрелками.","code":"","inter":"Мини-игра: нажимать шаги в правильном порядке, затем проверка.","lead":true,"mood":"day"},{"id":"goodalgo","tag":"Основы","badge":"3 свойства","title":"В хорошем алгоритме…","text":"Хороший алгоритм подчиняется трём правилам. Ведь исполнитель (например, компьютер) не умеет думать за нас!","prompt":"Таблица из трёх широких глиняных строк. Слева — свойство с цветной иконкой (галочка, стрелки-порядок, мишень), справа — объяснение «Почему?» на светлой подложке. Строки появляются по очереди. Фон — сиренево-голубой.","code":"","inter":"","lead":true,"mood":"day"},{"id":"canrun","tag":"Задание","badge":"Проверка","title":"Сможет ли компьютер выполнить этот набор действий?","text":"","prompt":"Слева — «записка» на листе в клетку (как заметка ребёнка): команды разбросаны вкривь и вкось. Справа — интерактивный список тех же команд: у каждой строки две пилюли «✓ Сможет» и «✗ Не сможет». Снизу — большая зелёная кнопка «Проверить». После проверки строки окрашиваются: мятные — верно, розовые — ошибка, и под каждой появляется объяснение. В конце — редактор кода с «исправленной» версией на Python. Фон — фиолетово-мятный.","code":"ክበብ መሳል\nУмножить 3 на 12\nУмножить 10 на 45\nСложить всё\nНапечатай на экране \"Итого к оплате:\"\n5000-486\n\n# Как это понял бы компьютер (Python):\nprint(\u0027Итого к оплате:\u0027, 3 * 12 + 10 * 45)\nprint(5000 - 486)","inter":"Выбор «Сможет / Не сможет» для каждой команды → кнопка «Проверить» → объяснения и счёт.","lead":false,"mood":"day"},{"id":"recognize","tag":"Основы","badge":"3 условия","title":"Компьютер распознаёт набор команд, если:","text":"Вот три условия, при которых компьютер тебя поймёт.","prompt":"Таблица «Свойство → Почему?» из трёх глиняных строк, как в слайде про хороший алгоритм, но в мятно-голубой гамме. Иконки: глобус (один язык), кирпичики (команды отделены), бирка (слова оформлены иначе). Справа сбоку — 3D-робот с поднятым большим пальцем.","code":"","inter":"","lead":true,"mood":"day"},{"id":"lang","tag":"Основы","badge":"Определение","title":"Язык программирования — это язык общения с машинами","text":"Язык программирования — это средство общения человека с машиной. Он позволяет давать компьютеру инструкции, которые тот может выполнить. Без него компьютер не знает, что делать.","prompt":"Слева — две карточки: «Набор команд» (иконка-словарь) и «Однозначность» (иконка-мишень). Справа — 3D-персонаж за компьютером. Внизу — анимированная полоска-переводчик: слово «Hi» превращается в бегущие нули и единицы (двоичный код). Фон — голубой.","code":"\u0027Hi\u0027  →  01001000 01101001","inter":"","lead":true,"mood":"day"},{"id":"program","tag":"Основы","badge":"Определение","title":"Программа","text":"Программа — это алгоритм, записанный на языке программирования.","prompt":"Большое определение на белом острове. Под ним мини-пример «до и после»: слева карточка-записка «Алгоритм словами: вывести на экран приветствие», стрелка, справа детский редактор кода с print(\u0027Привет!\u0027) и терминал с результатом. Справа — 3D-персонаж за столом. Фон — нежно-сиреневый.","code":"print(\u0027Привет!\u0027)","inter":"","lead":true,"mood":"day"},{"id":"rules","tag":"Основы","badge":"Правила","title":"Три золотых правила кодера","text":"Нарушишь правило — программа сломается. Нажми на карточку, чтобы перевернуть её и увидеть пример!","prompt":"Слева — 3D-сцена: трое детей с ноутбуками на глиняных кубах-ступенях. Справа — три крупные карточки-правила с цветной окантовкой (бирюзовая, оранжевая, красная), у каждой иконка, заголовок, пояснение и мини-редактор кода с переключателем «❌ Ошибка / ✅ Правильно» и окошком ответа компьютера. Фон — переход из розового в голубой.","code":"   print(\u0027Привет\u0027)      # ❌ лишние пробелы в начале\nprint(\u0027Привет\u0027)         # ✅\n\nprint(\u0027А\u0027) print(\u0027Б\u0027)   # ❌ две команды в одной строке\nprint(\u0027А\u0027)\nprint(\u0027Б\u0027)              # ✅\n\nPrint(\u0027Привет\u0027)         # ❌ заглавная буква\nprint(\u0027Привет\u0027)         # ✅","inter":"Переключатель у каждого правила: показывает ошибочный и правильный код и реальный ответ компьютера.","lead":true,"mood":"day"},{"id":"summary1","tag":"Итоги","badge":"Выводы","title":"Выводы","text":"Запомни три главные мысли.","prompt":"Три карточки-вывода с большими 3D-галочками, расположенные лесенкой. Справа — фото-иллюстрация рук на клавиатуре ноутбука с кодом, мягко размытая. Фон — светлый мятный.","code":"","inter":"","lead":true,"mood":"day"},{"id":"io","tag":"print()","badge":"Раздел","title":"Вывод информации. Функция print()","text":"Новая глава: учимся выводить информацию на экран с помощью функции print().","prompt":"Раздел-заставка. Две весёлые пластилиновые змейки (зелёная и жёлтая) выползают из-за левого края. Заголовок — на белом острове справа. Фон — мятно-жёлтый градиент.","code":"","inter":"","lead":true,"mood":"day"},{"id":"func","tag":"print()","badge":"Определение","title":"Функция","text":"Функция — это алгоритм, записанный на языке программирования. У функции есть имя: напишешь его со скобками — и весь алгоритм выполнится. Как волшебная кнопка!","prompt":"Слева — определение, справа — 3D-кнопка-«волшебная палочка»: при нажатии из неё вылетают искры и появляется плашка print(). Фон — тёмно-синий с светящимися строками кода (как на заставке хакерского фильма, но в мягких детских цветах).","code":"","inter":"Кнопка «Вызвать функцию» показывает анимацию.","lead":true,"mood":"day"},{"id":"anatomy","tag":"print()","badge":"Анатомия","title":"Голос компьютера: функция print()","text":"Разберём функцию по частям. Нажми на любую часть кода!","prompt":"В центре — окно терминала macOS-стиля в глиняной оправе, внутри огромный код print(\u0027Привет!\u0027): print — синий, скобки — чёрные, кавычки — зелёные, текст — зелёный. Вокруг четыре цветных пузыря-подсказки со стрелками (голубой, зелёный, оранжевый, фиолетовый). Нажатая часть кода подсвечивается, связанный пузырь пульсирует. Под окном — терминал с ответом. Фон — оранжево-розовый.","code":"print(\u0027Привет!\u0027)","inter":"Нажатие на часть кода подсвечивает её объяснение.","lead":true,"mood":"day"},{"id":"lab","tag":"print()","badge":"Лаборатория","title":"Лаборатория print(): Что умеет эта функция?","text":"","prompt":"Тёмная «лаборатория»: фон — глубокий фиолетовый с розовыми бликами. Большое окно-панель с тремя точками и надписью «Интерактивная лаборатория print()». Сверху — пять вкладок-пилюль (Текст, Число, Математика, Склеивание, Умножение строки). Ниже два больших окна одинаковой высоты: слева «Редактор заклинаний» (можно печатать свой код), справа «Экран вывода» (зелёный моноширинный текст). Под ними — широкая изумрудная кнопка «Запустить заклинание!» и подсказка.","code":"# 1. Текст\nprint(\u0027Hello, World!\u0027)\n\n# 2. Число\nprint(-2)\n\n# 3. Математика\nprint(10 * 5)\n\n# 4. Склеивание\nprint(\u0027Python\u0027 + \u0027 — это круто!\u0027)\n\n# 5. Умножение строки\nprint(\u0027😺 Мяу! \u0027 * 3)","inter":"Вкладки загружают пример и сразу запускают его; код можно менять и запускать заново (работает настоящий мини-интерпретатор).","lead":false,"mood":"lab"},{"id":"task1","tag":"Задание","badge":"Практикум","title":"Задание «Функция print()»","text":"Миссия 1: проверь каждую команду — сработает она или компьютер выдаст ошибку? Потом напиши свою программу!","prompt":"Тёмно-синий фон с голубыми искрами. Слева — список заклинаний print() на глиняных строках с пилюлями «✓ Сработает / ✗ Ошибка» и кнопкой «Проверить». После проверки рядом с каждой строкой появляется настоящий ответ компьютера. Справа — 3D-змейка Python со светящимися значками. Ниже — мини-редактор «Твоё заклинание» с кнопкой запуска.","code":"print(\u0027Привет, мир!\u0027)\nPrint(\u0027Привет\u0027)\nprint(Привет)\nprint(7 + 8)\nprint(\u00277 + 8\u0027)\nprint(\u0027Мяу\u0027\nprint(\"Ура!\u0027)\nprint(\u0027Ха\u0027 * 3)","inter":"Выбор «Сработает / Ошибка» → «Проверить» → реальные ответы. Мини-редактор для своей программы.","lead":true,"mood":"lab"},{"id":"platform1","tag":"Задание","badge":"Платформа","title":"Выполни задание №1 на платформе","text":"","prompt":"","code":"","inter":"","lead":false,"mood":"day"},{"id":"warmup","tag":"Разминка","badge":"Перерыв","title":"Разминка","text":"","prompt":"Яркий фон с брызгами цвета. Справа — 3D-голова-силуэт, из которой вылетают мысли-пузыри и вопросительные знаки. Слева — список утверждений на глиняных строках с пилюлями «👍 Правда / 👎 Миф» и кнопкой «Проверить».","code":"","inter":"Выбор «Правда / Миф» → «Проверить» → объяснения.","lead":false,"mood":"day"},{"id":"turtle","tag":"Turtle","badge":"Цифровой питомец","title":"Призыв цифрового питомца: Модуль Turtle","text":"В Python есть встроенная робот-черепашка. Она превращает строчки кода в настоящую графику!","prompt":"Фон — голубо-розовый с линиями микросхем. Наверху — 3D-черепашка с панцирем-микросхемой, от неё изогнутая розовая стрелка к логотипу Python. Ниже — окно терминала с огромной строкой from turtle import *. Справа — мини-холст в клетку. По кнопке «Призвать питомца» черепашка появляется с искрами и рисует звёздочку.","code":"from turtle import *","inter":"Кнопка «Призвать питомца»: черепашка появляется и рисует звезду.","lead":true,"mood":"day"},{"id":"gallery","tag":"Turtle","badge":"Галерея","title":"Галерея бесконечных возможностей…","text":"Это только начало! Добавив цвета и немного магии, твоя черепашка сможет создавать настоящие шедевры.","prompt":"Арт-галерея: большой холст-рамка в клетку и четыре кнопки-миниатюры (квадратная спираль, цветок-спирограф, радужный цветок, золотая звезда). По нажатию черепашка рисует узор вживую, рядом — код узора в детском редакторе. Внизу — плашка с фиолетово-голубой градиентной рамкой. Фон — светло-голубой.","code":"from turtle import *\nspeed(0)\nfor i in range(60):\n    forward(i * 5)\n    left(90)","inter":"Кнопки узоров: черепашка рисует узор и показывает его код.","lead":true,"mood":"day"},{"id":"import","tag":"Turtle","badge":"Расшифровка","title":"Призыв цифрового питомца: расшифруем команду","text":"Строка подключения пишется в самом начале программы. Нажми на каждое слово, чтобы узнать, что оно значит.","prompt":"Та же сцена, что и в прошлом призыве, но окно терминала увеличено, и каждое слово строки from turtle import * — отдельная глиняная плашка своего цвета. При нажатии плашка подпрыгивает, а под ней раскрывается карточка с переводом. Внизу — пояснение, что такое модуль (коробка с готовыми командами).","code":"from turtle import *","inter":"Нажатие на слово показывает его перевод.","lead":true,"mood":"day"},{"id":"pad","tag":"Turtle","badge":"Пульт","title":"Пульт управления Черепашкой","text":"Нажимай кнопки на пульте — черепашка будет двигаться, а ты увидишь, какую программу написал!","prompt":"Фон — фиолетово-голубой с микросхемами. В центре — 3D-геймпад, вокруг него глиняные кнопки-команды со стрелками: forward(150) — вперёд, left(90) — налево, right(90) — направо, color(\u0027red\u0027) — палитра цветов, и бонус-кнопка exitonclick(). Справа — холст в клетку с черепашкой, под ним — редактор, куда автоматически дописывается каждая нажатая команда.","code":"forward(150)   # движение вперёд на 150 шагов\nleft(90)       # поворот налево на 90 градусов\nright(90)      # поворот направо на 90 градусов\ncolor(\u0027red\u0027)   # выбрать цвет карандаша\nexitonclick()  # чтобы рисунок не исчез в конце!","inter":"Кнопки пульта управляют черепашкой на холсте и дописывают код программы.","lead":true,"mood":"day"},{"id":"task2","tag":"Задача","badge":"Разбор","title":"Рассмотрим задачу","text":"Задача. Напишите программу, отрисовывающую чёрный квадрат без заливки со стороной 150 пикселей.","prompt":"Слева — карточка-«свиток» с условием задачи и двумя вопросами-подсказками, которые раскрываются по нажатию. Справа — белый холст с чёрным квадратом и стрелкой, показывающей направление обхода. Фон — светло-голубой.","code":"","inter":"Вопросы «Как подключить модуль?» и «Какие команды нужны?» раскрывают ответы.","lead":true,"mood":"day"},{"id":"geom","tag":"Задача","badge":"Геометрия","title":"Рассмотрим задачу: Геометрия квадрата","text":"Вспомним геометрию! У квадрата все 4 стороны равны (a = 150 пикселей), а каждый угол — ровно 90 градусов. Значит, черепашка должна 4 раза пройти 150 шагов и после каждого отрезка повернуть налево на 90 градусов.","prompt":"Слева — текст на белом острове, справа — интерактивная схема квадрата: стороны подписаны «a = 150», в углах — значки прямого угла 90°, вокруг красный пунктирный путь черепашки со стрелками. Кнопка «Пройти путь» подсвечивает стороны по очереди. Фон — голубой.","code":"","inter":"Кнопка подсвечивает стороны и углы по очереди.","lead":true,"mood":"day"},{"id":"draw","tag":"Задача","badge":"Анимация","title":"Анатомия рисунка: Чёрный квадрат","text":"Нарисуй квадрат со стороной 150 пикселей. Нажми кнопку — и смотри, какую строчку сейчас выполняет черепашка!","prompt":"Белый остров разделён на две части. Слева — холст в клетку (25 пикселей на клетку) с черепашкой и табло «X | Y | Угол». Справа — тёмный редактор со скриптом, текущая строка подсвечивается жёлтым. Над редактором — палитра цветов карандаша в виде глиняных кружков. Под ним — большая оранжевая кнопка «Нарисовать квадрат» и кнопка сброса. Фон — розово-голубой.","code":"from turtle import *\nforward(150)\nleft(90)\nforward(150)\nleft(90)\nforward(150)\nleft(90)\nforward(150)\nexitonclick()","inter":"Черепашка рисует квадрат по шагам, текущая строка кода подсвечивается; можно выбрать цвет.","lead":true,"mood":"day"},{"id":"task3","tag":"Задание","badge":"Платформа","title":"Выполни задание №2 на платформе","text":"","prompt":"Слева — список из пяти программ-карточек (код в мини-редакторах) с пилюлями «✓ Квадрат / ✗ Не квадрат». Справа — холст в клетку с черепашкой и логотипом Python. Кнопка «Проверить», у каждой программы — кнопка «▶ На холст». Фон — мятно-голубой.","code":"# A\nforward(150)\nleft(90)  # ×4\n\n# B\nforward(150)\nright(90) # ×4\n\n# C\nforward(150)\nleft(60)  # ×4\n\n# D\nForward(150)\nleft(90)  # ×4\n\n# E\nforward(150)\nleft(90)\nforward(100)\nleft(90)  # ×2","inter":"Выбор ответа для каждой программы → «Проверить»; любую программу можно запустить на холсте.","lead":false,"mood":"day"},{"id":"bonus","tag":"Бонус","badge":"Свободный режим","title":"Бонус-задание","text":"Выбери один из рисунков и попробуй нарисовать его с помощью черепашки и Python. Сторона клетки равна 25 пикселям.","prompt":"Слева — две карточки-образца на клетчатой бумаге (пиксельное сердце и лось), выбранная подсвечивается. Справа — полноценная песочница: редактор кода с кнопками «Запустить», «Очистить» и «Подсказка», и большой холст в клетку 25 px. Фон — сиреневый с жёлтыми звёздочками.","code":"from turtle import *\n# сердце: начни с верхней точки слева\nright(90)\nforward(25)\nleft(90)\nforward(25)\n# … продолжай по клеточкам!","inter":"Песочница: свой код запускается на холсте 25 px/клетка; кнопка показывает готовое решение для сердца.","lead":true,"mood":"day"},{"id":"final","tag":"Итоги","badge":"Раздел","title":"Итоги занятия","text":"Миссия почти выполнена! Подведём итоги.","prompt":"Раздел-заставка. Синяя 3D-змейка извивается рядом с клетчатым финишным флагом. Заголовок на белом острове. Фон — сине-голубой.","code":"","inter":"","lead":true,"mood":"day"},{"id":"outro","tag":"Итоги","badge":"Уровень пройден","title":"Итоги миссии: Курс Python Start","text":"Сегодня ты разблокировал три навыка. Впереди — новые уровни!","prompt":"Игровой экран «Уровень пройден» на тёмно-синем космическом фоне с искрами. Слева колонка «Разблокировано сегодня» — три зелёные неоновые плашки с галочками. Справа «Следующие уровни» — три серые плашки с замками и цепями. Внизу — огромная оранжево-жёлтая кнопка «Готов к следующему уровню? Подключайся!», при нажатии вылетает конфетти.","code":"","inter":"Кнопка запускает конфетти.","lead":true,"mood":"night"}];

<script>
/* ===== Мини-Python для детей: print(), числа, строки, списки, for-range, turtle ===== */
const PY = (() => {
  class PyErr extends Error {
    constructor(type, msg, hint, line) { super(msg); this.type = type; this.hint = hint || ''; this.line = line; }
  }
  const I = v => ({ t: 'int', v }), F = v => ({ t: 'float', v }), S = v => ({ t: 'str', v }), L = v => ({ t: 'list', v });
  const isNum = x => x.t === 'int' || x.t === 'float';
  const TYPE = x => ({ int: 'int', float: 'float', str: 'str', list: 'list', range: 'range' })[x.t];

  const TURTLE = {
    forward: 'fd', fd: 'fd', backward: 'bk', back: 'bk', bk: 'bk', left: 'lt', lt: 'lt', right: 'rt', rt: 'rt',
    color: 'color', pencolor: 'color', width: 'width', pensize: 'width', penup: 'up', pu: 'up', up: 'up',
    pendown: 'down', pd: 'down', down: 'down', goto: 'goto', setpos: 'goto', setposition: 'goto', home: 'home',
    setheading: 'seth', seth: 'seth', circle: 'circle', speed: 'speed', shape: 'noop', exitonclick: 'noop',
    done: 'noop', mainloop: 'noop', hideturtle: 'hide', ht: 'hide', showturtle: 'show', st: 'show',
    bgcolor: 'noop', begin_fill: 'noop', end_fill: 'noop', fillcolor: 'noop', Screen: 'noop'
  };
  const ARGNAME = { fd: 'distance', bk: 'distance', lt: 'angle', rt: 'angle', seth: 'to_angle', width: 'width', circle: 'radius', speed: 'speed' };
  const BUILTIN = ['print', 'range', 'len', 'str', 'int', 'abs', 'round'];
  const ALLNAMES = BUILTIN.concat(Object.keys(TURTLE));

  function fmtFloat(v) {
    if (!isFinite(v)) return v > 0 ? 'inf' : v < 0 ? '-inf' : 'nan';
    if (Number.isInteger(v) && Math.abs(v) < 1e16) return v.toFixed(1);
    return String(v);
  }
  function toStr(x) {
    if (x.t === 'int') return String(x.v);
    if (x.t === 'float') return fmtFloat(x.v);
    if (x.t === 'str') return x.v;
    if (x.t === 'list') return '[' + x.v.map(repr).join(', ') + ']';
    if (x.t === 'range') return 'range(...)';
    return '?';
  }
  function repr(x) { return x.t === 'str' ? "'" + x.v + "'" : toStr(x); }

  function tokenize(s, line) {
    const toks = []; let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (c === ' ' || c === '\t') { i++; continue; }
      if (c === '#') break;
      if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(s[i + 1] || ''))) {
        let j = i; while (j < s.length && /[0-9_]/.test(s[j])) j++;
        let f = false;
        if (s[j] === '.') { f = true; j++; while (j < s.length && /[0-9]/.test(s[j])) j++; }
        if (/[A-Za-zА-Яа-яЁё_]/.test(s[j] || '')) throw new PyErr('SyntaxError', 'invalid decimal literal', 'Число и буквы склеились. Поставь между ними пробел или знак действия.', line);

      }
      if (c === "'" || c === '"') {
        let j = i + 1, out = '';
        while (j < s.length && s[j] !== c) {
          if (s[j] === '\\' && j + 1 < s.length) { const n = s[j + 1]; out += n === 'n' ? '\n' : n === 't' ? '\t' : n; j += 2; continue; }
          out += s[j]; j++;
        }
        if (j >= s.length) {
          const other = c === "'" ? '"' : "'";
          const hint = s.slice(i + 1).includes(other)
            ? 'Кавычки должны быть одинаковыми: открыл ' + c + ' — закрой тоже ' + c + '.'
            : 'Кавычка открыта, но не закрыта. Поставь такую же кавычку в конце текста.';
          throw new PyErr('SyntaxError', 'unterminated string literal', hint, line);
        }
        toks.push({ k: 'str', v: out }); i = j + 1; continue;
      }

        let j = i; while (j < s.length && /[A-Za-z0-9А-Яа-яЁё_]/.test(s[j])) j++;
        toks.push({ k: 'name', v: s.slice(i, j) }); i = j; continue;
      }
      const two = s.slice(i, i + 2);
      if (['**', '//', '==', '!=', '<=', '>='].includes(two)) { toks.push({ k: 'op', v: two }); i += 2; continue; }

      throw new PyErr('SyntaxError', 'invalid syntax', 'Python не понял эту строку. Команды пишутся так: имя(значение).', n.line);
    }

    if (!(name === 'print' || TURTLE[name])) throw nameErr(name, ctx, n.line, false);
    if (TURTLE[name] && !ctx.turtle) throw nameErr(name, ctx, n.line, false);

    callStmt(name, args, ctx, n.line);
  }

  function run(src, opt = {}) {
    const ctx = { env: {}, out: [], cmds: [], turtle: !!opt.turtle, steps: 0 };

      const prog = build(src);

})();

function heartCode() {
  const P = [[3, 0], [3, 1], [4, 1], [4, 2], [5, 2], [5, 1], [6, 1], [6, 0], [8, 0], [8, 1], [9, 1], [9, 4], [8, 4], [8, 5], [7, 5], [7, 6], [6, 6], [6, 7], [5, 7], [5, 8], [4, 8], [4, 7], [3, 7], [3, 6], [2, 6], [2, 5], [1, 5], [1, 4], [0, 4], [0, 1], [1, 1], [1, 0], [3, 0]];
  let h = 0; const out = ['from turtle import *', '# Сердце: старт в верхней точке над левой «впадинкой»', "color('red')", 'width(4)'];
  for (let i = 1; i < P.length; i++) {
    const dx = P[i][0] - P[i - 1][0], dy = -(P[i][1] - P[i - 1][1]);
    const dir = Math.round(Math.atan2(dy, dx) * 180 / Math.PI); let t = ((dir - h + 540) % 360) - 180;
    if (t > 0) out.push(`left(${t})`); else if (t < 0) out.push(`right(${-t})`);
    h = dir; out.push(`forward(${Math.hypot(dx, dy) * 25})`);
  }
  out.push('exitonclick()'); return out.join('\n');
}

let cur = 0;
const N = META.length, slideEl = $('#slide');
function head(m, i) {
  return `<div class="sl-head"><span class="chip num">СЛАЙД ${i + 1} ИЗ ${N}</span><span class="chip">${esc(m.tag)}</span><span class="sp"></span><span class="chip badge">✨ ${esc(m.badge)}</span></div>`;
}
let curWrap = null;
/* подгоняем слайд под высоту экрана, чтобы не приходилось прокручивать */
function fitSlide() {
  const w = curWrap; if (!w) return;
  w.style.zoom = '';
  if (innerWidth < 900) return;
  const cs = getComputedStyle(slideEl), padV = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  let k = 1;
  for (let n = 0; n < 5; n++) {
    const content = slideEl.scrollHeight - padV, avail = slideEl.clientHeight - padV;
    if (content <= avail + 1) break;
    k = Math.max(0.55, k * avail / content);
    w.style.zoom = k;
    if (k === 0.55) break;
  }
}
let fitT;
window.addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fitSlide, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitSlide);
function render(i, anim = true) {
  if (curWrap && curWrap._cleanup) { try { curWrap._cleanup(); } catch (e) { } }
  cur = Math.max(0, Math.min(N - 1, i));
  const m = META[cur], r = R[m.id] || { html: () => '' };
  const dark = m.mood === 'lab' || m.mood === 'night';
  document.body.dataset.bg = m.mood === 'lab' ? 'lab' : m.mood === 'night' ? 'night' : String(cur % 5);
  slideEl.className = 'slide' + (dark ? ' dark' : '');
  const wrap = document.createElement('div');
  wrap.innerHTML = head(m, cur) + (r.own ? '' : `<h1 class="t">${esc(m.title)}</h1>${m.lead && m.text ? `<p class="lead">${esc(m.text)}</p>` : ''}`) + `<div class="body">${r.html(m)}</div>`;
  slideEl.replaceChildren(wrap); curWrap = wrap;
